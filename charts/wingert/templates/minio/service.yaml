apiVersion: v1
kind: Service
metadata:
  name: {{ include "wingert.fullname" . }}-minio
  labels:
    {{- include "wingert.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "wingert.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
